[project]
name = "ciphernet"
version = "1.0.0"
description = "Python-first end-to-end encrypted chat application"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0,<45.0",
  "bcrypt>=4.2,<6.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.9,<3.0",
  "streamlit>=1.39,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
